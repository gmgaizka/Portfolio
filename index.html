<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; }
        
        #viewport { 
            flex: 1; width: 100vw; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }

        #canvas { 
            display: block; transition: transform 0.2s ease-out; 
            transform-origin: center center; padding: 400px; /* Reducido para mejor control */
        }

        #flipbook { width: 2828px !important; height: 1000px !important; background: transparent; }
        .page { background: white; width: 1414px !important; height: 1000px !important; }
        .page img { width: 100% !important; height: 100% !important; object-fit: fill !important; }
        
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; }

        /* INTERFAZ ADAPTATIVA */
        .controls-container {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            width: 90%; /* Ocupa casi todo el ancho en móvil */
            max-width: 300px;
        }

        .bookmark {
            color: #888; font-size: 9px; font-weight: bold; letter-spacing: 2px;
            text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .zoom-bar { 
            background: rgba(25,25,25,0.85); padding: 8px 20px; border-radius: 50px; 
            border: 1px solid #333; display: flex; align-items: center; gap: 12px; 
            backdrop-filter: blur(10px); width: 100%; box-sizing: border-box;
        }
        
        #zoomRange { flex: 1; accent-color: #fff; cursor: pointer; height: 4px; }
        .zoom-bar span { color: white; font-size: 8px; font-weight: bold; letter-spacing: 2px; }

        /* AJUSTES ESPECÍFICOS PARA TELÉFONOS */
        @media (max-width: 768px) {
            #canvas { padding: 80px; } /* Menos margen para que el libro se vea más grande al inicio */
            .controls-container { bottom: 20px; }
            .zoom-bar { padding: 6px 15px; }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="canvas"><div id="flipbook"></div></div>
    </div>

    <div class="controls-container">
        <div class="bookmark" id="pageDisplay">PAG. 1 / 44</div>
        <div class="zoom-bar">
            <span>ZOOM</span>
            <input type="range" id="zoomRange" step="0.01">
        </div>
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';
        let initialScale = 1;

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414,
            height: 1000,
            size: 'fixed', 
            showCover: true, 
            usePortrait: false, // Mantenemos spread doble para que se vea como un libro real
            drawShadow: false,
            flippingTime: 800,
            startPage: 0,
            mobileScrollSupport: false // Desactivamos para que no interfiera con nuestro zoom
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        pageFlip.on('flip', (e) => {
            document.getElementById('pageDisplay').innerText = `PAG. ${e.data + 1} / ${totalPaginas}`;
        });

        function initZoom() {
            const isMobile = window.innerWidth <= 768;
            // En móvil el libro ocupa el 95% del ancho para no desperdiciar pantalla
            const marginFactor = isMobile ? 0.95 : 0.75;
            
            const scaleW = (window.innerWidth * marginFactor) / 1414;
            const scaleH = (window.innerHeight * marginFactor) / 1000;
            
            initialScale = Math.min(scaleW, scaleH);
            
            const zoomRange = document.getElementById('zoomRange');
            const canvas = document.getElementById('canvas');

            zoomRange.min = initialScale;
            // En móvil permitimos un zoom mucho más agresivo (4x) para leer detalles
            zoomRange.max = isMobile ? 4.0 : 2.5; 
            zoomRange.value = initialScale;
            canvas.style.transform = `scale(${initialScale})`;
        }

        loadImages();
        window.onload = initZoom;
        window.onresize = initZoom;

        document.getElementById('zoomRange').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            const canvas = document.getElementById('canvas');
            const viewport = document.getElementById('viewport');
            
            canvas.style.transform = `scale(${scale})`;
            
            if (scale > initialScale + 0.02) {
                viewport.style.overflow = 'auto';
                viewport.style.alignItems = 'flex-start';
                viewport.style.justifyContent = 'flex-start';
            } else {
                viewport.style.overflow = 'hidden';
                viewport.style.alignItems = 'center';
                viewport.style.justifyContent = 'center';
                viewport.scrollTo(0,0);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') pageFlip.flipNext();
            if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        });
    </script>
</body>
</html>
