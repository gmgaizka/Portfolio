<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* El contenedor de zoom ahora es mucho más libre */
        #zoom-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        #flipbook-wrapper {
            transition: transform 0.2s ease-out;
            transform-origin: center center;
            padding: 50px; /* Espacio para que al rotar las páginas no se corten */
        }

        /* LIBRO GRANDE: Ajustado para que ocupe el 90% del ancho de la pantalla */
        #flipbook { 
            width: 90vw; 
            height: calc(90vw * 0.707); /* Mantiene la proporción A3 */
            max-height: 85vh; /* Pero que no se pase de alto */
        }

        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
        }

        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: stretch; 
        }

        .controls {
            position: fixed;
            bottom: 25px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            border: 1px solid #444;
        }

        #zoom-slider {
            width: 150px;
            cursor: pointer;
            accent-color: #fff;
        }

        .controls span {
            color: white;
            font-family: sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="zoom-container">
        <div id="flipbook-wrapper">
            <div id="flipbook"></div>
        </div>
    </div>

    <div class="controls">
        <span>ZOOM</span>
        <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1">
    </div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/'; 

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, 
            height: 1000, 
            size: 'stretch',
            
            showCover: true, // La primera página es la portada
            usePortrait: false, // ¡IMPORTANTE! False para que se abra como un libro de dos páginas
            
            maxShadowOpacity: 0, 
            mobileScrollSupport: true,
            autoSize: true,
            flippingTime: 800
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Página ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();

        const slider = document.getElementById('zoom-slider');
        const wrapper = document.getElementById('flipbook-wrapper');

        slider.addEventListener('input', (e) => {
            wrapper.style.transform = `scale(${e.target.value})`;
        });
    </script>
</body>
</html>
