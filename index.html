<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio A3 Horizontal | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #1a1a1a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        #flipbook { 
            width: 95vw; 
            height: 80vh; 
        }
        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
        }
        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: stretch; /* Forzamos a que rellene el marco horizontal */
        }
    </style>
</head>
<body>
    <div id="flipbook"></div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/'; 

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            // PROPORCIÓN A3 HORIZONTAL (1414 : 1000)
            width: 1414, 
            height: 1000, 
            
            size: 'stretch',
            minWidth: 400,
            maxWidth: 2000,
            minHeight: 282,
            maxHeight: 1414,
            
            showCover: true, 
            maxShadowOpacity: 0.5,
            mobileScrollSupport: true,
            autoSize: true,
            // Importante para formatos horizontales:
            flippingTime: 1000,
            usePortrait: true, 
            startPage: 0
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Página ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();
    </script>
</body>
</html>
