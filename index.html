<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            height: 100vh; 
            overflow: hidden; 
        }

        #zoom-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto; /* Permite moverte cuando el zoom es grande */
        }

        #flipbook-wrapper {
            transition: transform 0.2s ease-out;
            transform-origin: center center;
            /* Forzamos que el contenedor sea grande de base */
            padding: 100px; 
        }

        /* TAMAÑO DEL LIBRO: Lo ponemos en píxeles para que NO sea pequeño */
        #flipbook { 
            width: 1414px; 
            height: 1000px; 
            /* Si la pantalla es pequeña, se ajustará, pero con el zoom crecerá */
            max-width: 95vw;
            max-height: 85vh;
        }

        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: stretch; 
        }

        .controls {
            position: fixed;
            bottom: 30px;
            background: rgba(30, 30, 30, 0.9);
            padding: 12px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #zoom-slider {
            width: 200px;
            cursor: pointer;
            accent-color: #fff;
        }

        .controls span {
            color: white;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="zoom-container">
        <div id="flipbook-wrapper">
            <div id="flipbook"></div>
        </div>
    </div>

    <div class="controls">
        <span>ZOOM</span>
        <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
    </div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/'; 

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, 
            height: 1000, 
            size: 'stretch',
            showCover: true, 
            usePortrait: false, // Muestra dos páginas abiertas (doble A3)
            maxShadowOpacity: 0, 
            mobileScrollSupport: true,
            autoSize: true,
            flippingTime: 800
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Página ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();

        const slider = document.getElementById('zoom-slider');
        const wrapper = document.getElementById('flipbook-wrapper');

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            wrapper.style.transform = `scale(${val})`;
            
            // Si hay mucho zoom, dejamos que el usuario haga scroll infinito
            if(val > 1.5) {
                wrapper.style.padding = "500px";
            } else {
                wrapper.style.padding = "100px";
            }
        });
    </script>
</body>
</html>
