<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio | Flipbook</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #e5e5e5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        #flipbook { 
            width: 100%; 
            height: 100vh; 
        }
        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
        }
        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Para que no se deformen las imágenes */
        }
    </style>
</head>
<body>
    <div id="flipbook"></div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/'; 

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 900,
            height: 1200,
            size: 'stretch',
            showCover: true,
            maxShadowOpacity: 0.3,
            mobileScrollSupport: true,
            usePortrait: true,
            autoSize: true
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                
                // Lógica para tus nombres de archivo: Portfolio.jpg, Portfolio2.jpg, etc.
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : `Portfolio${i}.jpg`;
                
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Página ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();
    </script>
</body>
</html>
