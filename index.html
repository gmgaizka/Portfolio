<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #1a1a1a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        #flipbook { 
            /* MÁS MARGEN: Ahora el libro ocupa solo el 60% del ancho */
            width: 60vw; 
            height: 65vh; 
        }

        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
            /* Sombra suave en los bordes exteriores solamente */
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: stretch; 
        }
    </style>
</head>
<body>
    <div id="flipbook"></div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/'; 

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, 
            height: 1000, 
            size: 'stretch',
            
            // ELIMINAR SOMBRA CENTRAL: Ponemos la opacidad a 0
            maxShadowOpacity: 0, 
            
            showCover: true, 
            mobileScrollSupport: true,
            autoSize: true,
            usePortrait: true, 
            flippingTime: 700
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Página ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();
    </script>
</body>
</html>
