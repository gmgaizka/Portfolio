<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Área de visualización */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: auto; /* Permite scroll si el zoom es grande */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El escalador */
        #canvas {
            transition: transform 0.2s ease;
            transform-origin: center center;
            padding: 50px;
        }

        /* EL LIBRO: Ahora con medidas fijas grandes */
        #flipbook { 
            width: 1200px; 
            height: 848px;
        }

        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
        }

        /* Barra de Zoom */
        .zoom-bar {
            position: fixed;
            bottom: 30px;
            z-index: 100;
            background: rgba(30,30,30,0.9);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #zoomRange { width: 150px; accent-color: #fff; cursor: pointer; }
        .zoom-bar span { color: white; font-family: sans-serif; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas">
            <div id="flipbook"></div>
        </div>
    </div>

    <div class="zoom-bar">
        <span>ZOOM</span>
        <input type="range" id="zoomRange" min="0.3" max="3" step="0.1" value="0.8">
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1200,
            height: 848,
            size: 'stretch',
            showCover: true,
            usePortrait: false, // Para ver dos páginas a la vez
            maxShadowOpacity: 0,
            autoSize: true
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Pág ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();

        // Control del Zoom
        const zoomRange = document.getElementById('zoomRange');
        const canvas = document.getElementById('canvas');

        zoomRange.addEventListener('input', (e) => {
            canvas.style.transform = `scale(${e.target.value})`;
        });

        // Ajuste inicial para que quepa en pantalla al cargar
        window.onload = () => {
            const screenWidth = window.innerWidth;
            if (screenWidth < 1200) {
                const initialZoom = (screenWidth / 1300).toFixed(1);
                zoomRange.value = initialZoom;
                canvas.style.transform = `scale(${initialZoom})`;
            }
        };
    </script>
</body>
</html>
