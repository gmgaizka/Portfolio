<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; 
            height: 100vh; 
            display: flex;
            flex-direction: column;
        }
        
        /* Contenedor que permite scroll total */
        #viewport { 
            flex: 1;
            width: 100vw; 
            overflow: auto; 
            text-align: center; /* Centro horizontal para elementos inline-block */
            padding: 50px; /* Margen de seguridad */
        }
        
        /* El "canvas" ahora se comporta como un bloque elástico */
        #canvas { 
            display: inline-block;
            transition: transform 0.2s ease-out; 
            transform-origin: center center; 
            margin: 100px auto; /* Esto permite que crezca hacia todos lados */
            vertical-align: middle;
        }
        
        #flipbook { 
            width: 1414px !important; 
            height: 1000px !important; 
            background: white; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        
        .page { background: white; width: 100%; height: 100%; }
        .page img { width: 100%; height: 100%; object-fit: fill; }

        /* Bloqueo de sombras internas */
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; }

        /* Barra de Zoom */
        .zoom-bar { 
            position: fixed; 
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999; 
            background: rgba(20,20,20,0.95); 
            padding: 12px 25px; 
            border-radius: 50px; 
            border: 1px solid #444; 
            display: flex; 
            align-items: center; 
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        #zoomRange { width: 180px; accent-color: #fff; cursor: pointer; }
        .zoom-bar span { color: white; font-family: sans-serif; font-size: 11px; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas">
            <div id="flipbook"></div>
        </div>
    </div>

    <div class="zoom-bar">
        <span>ZOOM</span>
        <input type="range" id="zoomRange" min="0.1" max="2.5" step="0.05" value="0.5">
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414,
            height: 1000,
            size: 'fixed',
            showCover: true, 
            usePortrait: false, 
            drawShadow: false,
            maxShadowOpacity: 0,
            showShadows: false,
            flippingTime: 1000
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();

        const zoomRange = document.getElementById('zoomRange');
        const canvas = document.getElementById('canvas');
        const viewport = document.getElementById('viewport');

        zoomRange.addEventListener('input', (e) => {
            const scale = e.target.value;
            canvas.style.transform = `scale(${scale})`;
            
            // Ajustamos el margen del contenedor para "engañar" al scroll
            // Si el zoom es muy grande, aumentamos el área de scroll
            const extraSpace = scale > 1 ? (scale * 500) + 'px' : '100px';
            canvas.style.margin = `${extraSpace} auto`;
        });

        // Ajuste inicial (Portada)
        window.onload = () => {
            const initialScale = (window.innerWidth * 0.45) / 1414; 
            const val = Math.min(Math.max(initialScale, 0.2), 0.6);
            zoomRange.value = val;
            canvas.style.transform = `scale(${val})`;
        };
    </script>
</body>
</html>
