<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { margin: 0; background: #333; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #flipbook { width: 100%; height: 100vh; }
        .page { background: white; width: 100%; height: 100%; }
        .page img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div id="flipbook"></div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/';

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 900,
            height: 1200,
            size: 'stretch',
            showCover: true,
            maxShadowOpacity: 0.3,
            mobileScrollSupport: true
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : `Portfolio${i}.jpg`;
                
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Página ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();
    </script>
</body>
</html>
