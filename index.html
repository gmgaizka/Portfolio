<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #viewport { width: 100vw; height: 100vh; overflow: auto; display: flex; justify-content: center; align-items: center; }
        #canvas { transition: transform 0.1s ease; transform-origin: center center; padding: 100px; }
        
        /* Tamaño A3 Horizontal Fijo */
        #flipbook { width: 1414px !important; height: 1000px !important; }
        
        .page { background: white; width: 100%; height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .page img { width: 100%; height: 100%; object-fit: fill; }

        /* Eliminación por CSS de cualquier residuo de sombra */
        .st-page-shadow, canvas { display: none !important; opacity: 0 !important; }

        .zoom-bar { position: fixed; bottom: 30px; z-index: 9999; background: rgba(20,20,20,0.95); padding: 15px 30px; border-radius: 50px; border: 1px solid #333; display: flex; align-items: center; gap: 20px; }
        #zoomRange { width: 200px; accent-color: #fff; cursor: pointer; }
        .zoom-bar span { color: white; font-family: sans-serif; font-size: 11px; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas">
            <div id="flipbook"></div>
        </div>
    </div>

    <div class="zoom-bar">
        <span>ZOOM</span>
        <input type="range" id="zoomRange" min="0.2" max="3" step="0.05" value="0.7">
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414,
            height: 1000,
            size: 'fixed',
            showCover: false, // Al ser horizontal y una sola página, mejor desactivar la portada separada
            
            // LA CLAVE: Forzamos Portrait para que no intente unir dos páginas y crear el lomo
            usePortrait: true, 
            drawShadow: false, 
            maxShadowOpacity: 0,
            showShadows: false,
            
            flippingTime: 800,
            mobileScrollSupport: true
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();

        const zoomRange = document.getElementById('zoomRange');
        const canvas = document.getElementById('canvas');
        zoomRange.addEventListener('input', (e) => {
            canvas.style.transform = `scale(${e.target.value})`;
        });

        window.onload = () => {
            // Ajuste para que se vea una página grande centrada
            const initialScale = (window.innerHeight * 0.8) / 1000;
            zoomRange.value = initialScale;
            canvas.style.transform = `scale(${initialScale})`;
        };
    </script>
</body>
</html>
