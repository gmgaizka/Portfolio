<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Contenedor principal que permite el scroll */
        #viewport { 
            flex: 1;
            width: 100vw; 
            overflow: auto; /* Permite scroll en todas direcciones al hacer zoom */
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-behavior: smooth;
        }
        
        /* El lienzo donde vive el libro */
        #canvas { 
            transition: transform 0.2s ease-out; 
            transform-origin: center center; 
            padding: 200px; /* Espacio extra para que el zoom no choque con los bordes */
            display: inline-block;
        }
        
        #flipbook { 
            width: 1414px !important; 
            height: 1000px !important; 
            background: white; 
        }
        
        .page { background: white; width: 100%; height: 100%; }
        .page img { width: 100%; height: 100%; object-fit: fill; }

        /* Seguimos bloqueando las sombras */
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; visibility: hidden !important; }

        /* Controles */
        .zoom-bar { 
            position: fixed; 
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999; 
            background: rgba(20,20,20,0.95); 
            padding: 15px 30px; 
            border-radius: 50px; 
            border: 1px solid #333; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
        }
        
        #zoomRange { width: 200px; accent-color: #fff; cursor: pointer; }
        .zoom-bar span { color: white; font-family: sans-serif; font-size: 11px; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas">
            <div id="flipbook"></div>
        </div>
    </div>

    <div class="zoom-bar">
        <span>ZOOM</span>
        <input type="range" id="zoomRange" min="0.1" max="3" step="0.05" value="0.7">
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414,
            height: 1000,
            size: 'fixed',
            showCover: true, 
            usePortrait: false, 
            drawShadow: false,
            maxShadowOpacity: 0,
            showShadows: false,
            flippingTime: 1000,
            mobileScrollSupport: true
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();

        const zoomRange = document.getElementById('zoomRange');
        const canvas = document.getElementById('canvas');
        const viewport = document.getElementById('viewport');

        zoomRange.addEventListener('input', (e) => {
            const scale = e.target.value;
            canvas.style.transform = `scale(${scale})`;
            
            // Re-centrar el scroll automáticamente al cambiar el zoom
            // Esto evita que se "pierda" el libro
            if (scale > 1) {
                viewport.style.alignItems = 'flex-start';
                viewport.style.justifyContent = 'flex-start';
            } else {
                viewport.style.alignItems = 'center';
                viewport.style.justifyContent = 'center';
            }
        });

        window.onload = () => {
            const initialScale = (window.innerWidth * 0.4) / 1414; 
            const val = Math.min(Math.max(initialScale, 0.1), 0.7);
            zoomRange.value = val;
            canvas.style.transform = `scale(${val})`;
        };
    </script>
</body>
</html>
