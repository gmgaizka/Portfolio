<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; background: #111; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column; 
            font-family: 'Constantia', serif; 
        }
        
        #viewport { 
            flex: 1; width: 100vw; height: 100vh; 
            overflow: hidden; display: block; 
            -webkit-overflow-scrolling: touch;
        }

        #scroll-area {
            width: 6000px; height: 4000px;
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        #canvas { 
            width: 3400px; height: 1400px;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s ease-out; 
            transform-origin: center center;
            will-change: transform;
            position: relative;
        }

        #flipbook { width: 2828px !important; height: 1000px !important; background: transparent; position: relative; }
        .page { background: white; width: 1414px !important; height: 1000px !important; }
        .page img { width: 100% !important; height: 100% !important; object-fit: fill !important; }
        
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; }

        /* ZONAS DE CLIC MANUALES (Invisibles pero funcionales) */
        .click-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; z-index: 50; pointer-events: none;
        }
        .click-zone {
            flex: 1; height: 100%; pointer-events: auto; cursor: pointer;
        }

        .ui-wrapper {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999;
            width: 90%; max-width: 500px;
        }
        .control-bar { 
            background: rgba(20, 20, 20, 0.9); padding: 12px 25px; border-radius: 50px; 
            border: 1px solid #444; display: flex; align-items: center; justify-content: space-between; 
            gap: 20px; backdrop-filter: blur(15px);
        }
        .label, .page-counter { color: white; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
        .page-counter { color: #888; min-width: 80px; text-align: right; }
        #zoomRange { flex: 1; accent-color: #fff; cursor: pointer; height: 2px; }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="scroll-area">
            <div id="canvas">
                <div id="flipbook">
                    <div class="click-layer">
                        <div class="click-zone" id="prevZone"></div>
                        <div class="click-zone" id="nextZone"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="ui-wrapper">
        <div class="control-bar">
            <span class="label">ZOOM</span>
            <input type="range" id="zoomRange" step="0.01">
            <span class="page-counter" id="pageDisplay">PAG. 1 / 44</span>
        </div>
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';
        let initialScale = 1;

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, height: 1000, size: 'fixed', 
            showCover: true, usePortrait: false, flippingTime: 800, 
            startPage: 0, drawShadow: false, showPageCorners: false,
            clickEventForward: false, // Desactivamos el clic automático de la librería
            useMouseEvents: false     // Solo usaremos nuestras zonas y flechas
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        pageFlip.on('flip', (e) => {
            document.getElementById('pageDisplay').innerText = `PAG. ${e.data + 1} / ${totalPaginas}`;
        });

        // Configuración de nuestras zonas de clic
        document.getElementById('prevZone').onclick = () => {
            // Solo permitimos pasar página si no hay mucho zoom para evitar bugs
            if (parseFloat(document.getElementById('zoomRange').value) < initialScale + 0.5) {
                pageFlip.flipPrev();
            }
        };
        document.getElementById('nextZone').onclick = () => {
            if (parseFloat(document.getElementById('zoomRange').value) < initialScale + 0.5) {
                pageFlip.flipNext();
            }
        };

        function initZoom() {
            const isMobile = window.innerWidth <= 768;
            const marginFactor = isMobile ? 0.85 : 0.60;
            const scaleW = (window.innerWidth * marginFactor) / 1414;
            const scaleH = (window.innerHeight * marginFactor) / 1000;
            initialScale = Math.min(scaleW, scaleH);
            
            const zoomRange = document.getElementById('zoomRange');
            zoomRange.min = initialScale;
            zoomRange.max = isMobile ? 4.0 : 2.5; 
            zoomRange.value = initialScale;
            
            applyScale(initialScale);
            centerView();
        }

        function applyScale(scale) {
            const vp = document.getElementById('viewport');
            const canvas = document.getElementById('canvas');
            canvas.style.transform = `scale(${scale})`;
            
            if (scale > initialScale + 0.01) {
                vp.style.overflow = 'auto';
                // Si hay zoom, desactivamos los clics para que el usuario pueda arrastrar sin pasar página
                document.querySelector('.click-layer').style.pointerEvents = 'none';
            } else {
                vp.style.overflow = 'hidden';
                document.querySelector('.click-layer').style.pointerEvents = 'auto';
                centerView();
            }
        }

        function centerView() {
            const vp = document.getElementById('viewport');
            vp.scrollLeft = (6000 - window.innerWidth) / 2;
            vp.scrollTop = (4000 - window.innerHeight) / 2;
        }

        loadImages();
        window.onload = () => {
            initZoom();
            setTimeout(centerView, 200);
        };
        window.onresize = initZoom;

        document.getElementById('zoomRange').addEventListener('input', (e) => {
            applyScale(parseFloat(e.target.value));
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') pageFlip.flipNext();
            if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        });
    </script>
</body>
</html>
