<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* El viewport NO tendrá barras de scroll por defecto */
        #viewport { 
            flex: 1; 
            width: 100vw; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        #canvas { 
            display: block; 
            transition: transform 0.2s ease-out; 
            transform-origin: center center; 
            /* El padding aquí crea el área de navegación extra cuando hay zoom */
            padding: 500px; 
        }

        #flipbook { 
            width: 1414px !important; 
            height: 1000px !important; 
            background: white; 
            box-shadow: 0 0 50px rgba(0,0,0,0.6); 
        }

        .page { background: white; width: 100%; height: 100%; }
        .page img { width: 100%; height: 100%; object-fit: fill; }
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; }

        .zoom-bar { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; 
            background: rgba(30,30,30,0.95); padding: 12px 25px; border-radius: 50px; 
            border: 1px solid #444; display: flex; align-items: center; gap: 15px; backdrop-filter: blur(10px); 
        }
        #zoomRange { width: 180px; accent-color: #fff; cursor: pointer; }
        .zoom-bar span { color: white; font-family: sans-serif; font-size: 10px; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="canvas"><div id="flipbook"></div></div>
    </div>
    <div class="zoom-bar">
        <span>ZOOM</span>
        <input type="range" id="zoomRange" step="0.01">
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';
        let initialScale = 1;

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, height: 1000, size: 'fixed', showCover: true, 
            usePortrait: false, drawShadow: false, flippingTime: 1000
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        function initZoom() {
            // Calculamos la escala para que el libro ocupe solo el 75% de la pantalla
            // Esto garantiza márgenes visibles a los lados
            const scaleW = (window.innerWidth * 0.75) / 1414;
            const scaleH = (window.innerHeight * 0.75) / 1000;
            
            initialScale = Math.min(scaleW, scaleH);
            
            const zoomRange = document.getElementById('zoomRange');
            const canvas = document.getElementById('canvas');

            zoomRange.min = initialScale;
            zoomRange.max = 1.5; 
            zoomRange.value = initialScale;
            canvas.style.transform = `scale(${initialScale})`;
        }

        loadImages();
        window.onload = initZoom;
        window.onresize = initZoom;

        document.getElementById('zoomRange').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            const canvas = document.getElementById('canvas');
            const viewport = document.getElementById('viewport');
            
            canvas.style.transform = `scale(${scale})`;
            
            // ACTIVACIÓN DE BARRAS: Solo si el zoom es mayor que el inicial
            if (scale > initialScale + 0.05) {
                viewport.style.overflow = 'auto';
                viewport.style.alignItems = 'flex-start';
                viewport.style.justifyContent = 'flex-start';
            } else {
                viewport.style.overflow = 'hidden';
                viewport.style.alignItems = 'center';
                viewport.style.justifyContent = 'center';
                viewport.scrollTo(0,0);
            }
        });
    </script>
</body>
</html>
