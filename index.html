<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; background: #111; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column; 
            font-family: 'Constantia', serif; 
        }
        
        #viewport { 
            flex: 1; width: 100vw; height: 100vh; 
            overflow: hidden; /* Se activa dinámicamente */
            display: flex; justify-content: center; align-items: center;
            touch-action: pan-x pan-y; /* Permite scroll táctil nativo */
        }

        #canvas { 
            display: block; transition: transform 0.3s ease; 
            transform-origin: center center; will-change: transform;
            padding: 50px; /* Margen para que el libro no toque los bordes al scrollear */
        }

        #flipbook { width: 2828px !important; height: 1000px !important; background: transparent; }
        .page { background: white; width: 1414px !important; height: 1000px !important; }
        .page img { width: 100% !important; height: 100% !important; object-fit: fill !important; }
        
        canvas, .st-page-shadow { display: none !important; }

        /* INTERFAZ ABAJO */
        .ui-wrapper {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999;
            width: 90%; max-width: 500px;
        }

        .control-bar { 
            background: rgba(20, 20, 20, 0.95); padding: 12px 25px; border-radius: 50px; 
            border: 1px solid #444; display: flex; align-items: center; justify-content: space-between; 
            gap: 15px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .label, .page-counter { color: white; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .page-counter { color: #888; text-align: right; min-width: 65px; }
        #zoomRange { flex: 1; accent-color: #fff; cursor: pointer; height: 2px; }

        @media (max-width: 768px) {
            .ui-wrapper { width: 92%; bottom: 20px; }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="canvas"><div id="flipbook"></div></div>
    </div>

    <div class="ui-wrapper">
        <div class="control-bar">
            <span class="label">ZOOM</span>
            <input type="range" id="zoomRange" step="0.01">
            <span class="page-counter" id="pageDisplay">PAG. 1 / 44</span>
        </div>
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';
        let initialScale = 1;

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, height: 1000, size: 'fixed', 
            showCover: true, usePortrait: false, flippingTime: 1000, 
            startPage: 0, drawShadow: false, showPageCorners: false,
            mobileScrollSupport: false, // Desactivamos el scroll de la librería
            useMouseEvents: true,
            clickEventForward: true
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        pageFlip.on('flip', (e) => {
            document.getElementById('pageDisplay').innerText = `PAG. ${e.data + 1} / ${totalPaginas}`;
            resetZoom();
        });

        // Bloqueo de paso de página si hay zoom activo
        pageFlip.on('changeState', (e) => {
            const scale = parseFloat(document.getElementById('zoomRange').value);
            if (scale > initialScale + 0.05 && e.data === 'flipping') {
                // Si intenta pasar página con zoom, reseteamos para evitar bugs
                resetZoom();
            }
        });

        function initZoom() {
            const isMobile = window.innerWidth <= 768;
            const marginFactor = isMobile ? 0.95 : 0.65;
            const scaleW = (window.innerWidth * marginFactor) / 1414;
            const scaleH = (window.innerHeight * marginFactor) / 1000;
            initialScale = Math.min(scaleW, scaleH);
            
            const zoomRange = document.getElementById('zoomRange');
            zoomRange.min = initialScale;
            zoomRange.max = isMobile ? 4.0 : 2.5; 
            zoomRange.value = initialScale;
            
            applyScale(initialScale);
        }

        function applyScale(scale) {
            const canvas = document.getElementById('canvas');
            const vp = document.getElementById('viewport');
            canvas.style.transform = `scale(${scale})`;
            
            if (scale > initialScale + 0.05) {
                vp.style.overflow = 'auto'; // Habilita desplazamiento libre con el dedo
                // Desactivamos eventos de la librería para que no pase páginas sin querer
                pageFlip.updateConfig({useMouseEvents: false, clickEventForward: false});
            } else {
                vp.style.overflow = 'hidden';
                vp.scrollTo(0, 0);
                // Reactivamos eventos cuando el zoom es normal
                pageFlip.updateConfig({useMouseEvents: true, clickEventForward: true});
            }
        }

        function resetZoom() {
            const zoomRange = document.getElementById('zoomRange');
            zoomRange.value = initialScale;
            applyScale(initialScale);
        }

        loadImages();
        window.onload = initZoom;
        window.onresize = initZoom;

        document.getElementById('zoomRange').addEventListener('input', (e) => {
            applyScale(parseFloat(e.target.value));
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') pageFlip.flipNext();
            if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        });
    </script>
</body>
</html>
