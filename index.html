<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #1a1a1a; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Contenedor principal */
        #zoom-container {
            width: 100%;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto; /* Permite scroll cuando haces zoom */
        }

        /* Este es el que escalamos */
        #flipbook-wrapper {
            transition: transform 0.2s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* TAMAÑO DEL LIBRO: Lo subimos para que no se vea pequeño */
        #flipbook { 
            width: 1200px; /* Tamaño fijo en píxeles para que no se pierda */
            height: 848px; /* Manteniendo proporción A3 horizontal */
            max-width: 90vw; /* Pero que no se salga de la pantalla en monitores pequeños */
            max-height: 80vh;
        }

        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: stretch; 
        }

        /* CONTROLES */
        .controls {
            position: fixed;
            bottom: 20px;
            background: rgba(40, 40, 40, 0.9);
            padding: 12px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #zoom-slider {
            width: 150px;
            cursor: pointer;
            accent-color: #fff;
        }

        .controls span {
            color: white;
            font-family: sans-serif;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="zoom-container">
        <div id="flipbook-wrapper">
            <div id="flipbook"></div>
        </div>
    </div>

    <div class="controls">
        <span>ZOOM</span>
        <input type="range" id="zoom-slider" min="1" max="2.5" step="0.1" value="1">
    </div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/'; 

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, 
            height: 1000, 
            size: 'stretch',
            maxShadowOpacity: 0, 
            showCover: true, 
            mobileScrollSupport: true,
            autoSize: true,
            usePortrait: true, 
            flippingTime: 700
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Página ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();

        // Lógica del slider
        const slider = document.getElementById('zoom-slider');
        const wrapper = document.getElementById('flipbook-wrapper');

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            wrapper.style.transform = `scale(${val})`;
        });
    </script>
</body>
</html>
