<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Contenedor infinito para el zoom */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: auto; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El lienzo que escalamos */
        #canvas {
            transition: transform 0.1s ease;
            transform-origin: center center;
            padding: 100px;
            display: block;
        }

        /* TAMAÑO FIJO GIGANTE: 1414px es el estándar A3 horizontal */
        #flipbook { 
            width: 1414px !important; 
            height: 1000px !important;
        }

        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
        }

        /* Controles estilo minimal */
        .zoom-bar {
            position: fixed;
            bottom: 30px;
            z-index: 9999;
            background: rgba(20,20,20,0.95);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        #zoomRange { 
            width: 200px; 
            accent-color: #fff; 
            cursor: pointer; 
        }

        .zoom-bar span { 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            font-size: 11px; 
            font-weight: bold; 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="canvas">
            <div id="flipbook"></div>
        </div>
    </div>

    <div class="zoom-bar">
        <span>ZOOM</span>
        <input type="range" id="zoomRange" min="0.2" max="3" step="0.05" value="0.7">
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414,
            height: 1000,
            size: 'fixed', // FORZAMOS TAMAÑO FIJO
            minWidth: 1414,
            minHeight: 1000,
            maxWidth: 1414,
            maxHeight: 1000,
            showCover: true,
            usePortrait: false, // Doble página
            drawShadow: false, // ¡ADIÓS SOMBRA CENTRAL!
            flippingTime: 1000,
            maxShadowOpacity: 0 // Doble seguridad para las sombras
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Pág ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();

        // Lógica de Zoom corregida
        const zoomRange = document.getElementById('zoomRange');
        const canvas = document.getElementById('canvas');

        zoomRange.addEventListener('input', (e) => {
            canvas.style.transform = `scale(${e.target.value})`;
        });

        // Ajuste automático al cargar según pantalla
        window.onload = () => {
            const ratio = (window.innerWidth * 0.85) / 2828; // Calculamos para que quepa el libro abierto
            const initialZoom = Math.min(Math.max(ratio, 0.3), 0.7);
            zoomRange.value = initialZoom;
            canvas.style.transform = `scale(${initialZoom})`;
        };
    </script>
</body>
</html>
