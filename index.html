<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio | Flipbook</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { margin: 0; background: #e5e5e5; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #flipbook { width: 100%; height: 100vh; }
        .page { background: white; width: 100%; height: 100%; }
        .page img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div id="flipbook"></div>

    <script>
        const totalPaginas = 44; // CAMBIA ESTO por el número total de tus imágenes
        const carpeta = 'paginas/'; // Nombre de tu carpeta en GitHub

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 900,
            height: 1200,
            size: 'stretch',
            showCover: true, // La primera imagen será la portada [cite: 85, 172]
            maxShadowOpacity: 0.3
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                // Asume que tus fotos se llaman 1.jpg, 2.jpg...
                div.innerHTML = `<img src="${carpeta}${i}.jpg" alt="Página ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();
    </script>
</body>
</html>
