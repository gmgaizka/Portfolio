<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; height: 100vh; display: flex; flex-direction: column; font-family: 'Helvetica', sans-serif; }
        
        #viewport { 
            flex: 1; width: 100vw; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }

        #canvas { 
            display: block; transition: transform 0.2s ease-out; 
            transform-origin: center center; padding: 200px; 
        }

        #flipbook { width: 2828px !important; height: 1000px !important; background: transparent; }
        .page { background: white; width: 1414px !important; height: 1000px !important; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .page img { width: 100% !important; height: 100% !important; object-fit: fill !important; }
        
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; }

        /* INTERFAZ ULTRA MINIMALISTA */
        .ui-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .bookmark {
            color: #888; font-size: 10px; font-weight: 300; letter-spacing: 3px;
            text-transform: uppercase; transition: color 0.3s;
        }

        .zoom-panel { 
            background: rgba(20,20,20,0.8); padding: 8px 22px; border-radius: 50px; 
            border: 1px solid #333; display: flex; align-items: center; gap: 15px; 
            backdrop-filter: blur(10px);
        }

        input[type="range"] { width: 150px; accent-color: #fff; cursor: pointer; height: 2px; }
        .label { color: #fff; font-size: 8px; font-weight: bold; letter-spacing: 2px; }

        @media (max-width: 768px) {
            #canvas { padding: 40px; }
            .zoom-panel { padding: 6px 18px; }
            input[type="range"] { width: 100px; }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="canvas"><div id="flipbook"></div></div>
    </div>

    <div class="ui-container">
        <div class="bookmark" id="pageDisplay">PAG. 1 / 44</div>
        
        <div class="zoom-panel">
            <span class="label">ZOOM</span>
            <input type="range" id="zoomRange" step="0.01">
        </div>
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';
        let initialScale = 1;
        const isMobile = window.innerWidth <= 768;

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, height: 1000, size: 'fixed', 
            showCover: true, usePortrait: false, flippingTime: 1000, startPage: 0
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        // Actualizar el marcapáginas
        pageFlip.on('flip', (e) => {
            document.getElementById('pageDisplay').innerText = `PAG. ${e.data + 1} / ${totalPaginas}`;
        });

        function initZoom() {
            const marginFactor = isMobile ? 0.95 : 0.75;
            const scaleW = (window.innerWidth * marginFactor) / 1414;
            const scaleH = (window.innerHeight * marginFactor) / 1000;
            initialScale = Math.min(scaleW, scaleH);
            
            const zoomRange = document.getElementById('zoomRange');
            const canvas = document.getElementById('canvas');
            zoomRange.min = initialScale;
            zoomRange.max = isMobile ? 3.5 : 2.5; 
            zoomRange.value = initialScale;
            canvas.style.transform = `scale(${initialScale})`;
        }

        loadImages();
        window.onload = initZoom;
        window.onresize = initZoom;

        document.getElementById('zoomRange').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            const canvas = document.getElementById('canvas');
            const viewport = document.getElementById('viewport');
            canvas.style.transform = `scale(${scale})`;
            
            if (scale > initialScale + 0.05) {
                viewport.style.overflow = 'auto';
                viewport.style.alignItems = 'flex-start';
                viewport.style.justifyContent = 'flex-start';
            } else {
                viewport.style.overflow = 'hidden';
                viewport.style.alignItems = 'center';
                viewport.style.justifyContent = 'center';
                viewport.scrollTo(0,0);
            }
        });

        // Extra: Flechas del teclado para navegación rápida sin estorbos visuales
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') pageFlip.flipNext();
            if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        });
    </script>
</body>
</html>
