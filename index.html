<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio A3 Horizontal | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #1a1a1a; /* Fondo oscuro elegante */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        #flipbook { 
            width: 80vw; /* AQUÍ EL MARGEN: Ocupa el 80% del ancho, dejando 10% a cada lado */
            height: 75vh; /* Ajustado para que no toque arriba y abajo */
        }
        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); /* Sombra para que el plano parezca real */
        }
        .page img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Mantiene la proporción perfecta del A3 horizontal */
            padding: 10px; /* Un pequeño margen interno extra para que el dibujo no toque el borde del papel */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="flipbook"></div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/'; 

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, 
            height: 1000, 
            size: 'stretch',
            
            showCover: true, 
            maxShadowOpacity: 0.3,
            mobileScrollSupport: true,
            autoSize: true,
            
            // Configuramos para que se vea siempre de una en una página 
            // ya que son horizontales y muy anchas
            usePortrait: true,
            flippingTime: 800
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Página ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();
    </script>
</body>
</html>
