<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #1a1a1a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            /* Esto evita que aparezcan barras de scroll raras */
            overflow: hidden; 
        }

        #flipbook { 
            /* REDUCIMOS EL ANCHO AQUÍ PARA QUE VEAS MÁS FONDO */
            width: 70vw; /* 70% del ancho de la pantalla. Si quieres más margen, baja a 60vw */
            height: 70vh; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page { 
            background: white; 
            width: 100%; 
            height: 100%; 
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        .page img { 
            width: 100%; 
            height: 100%; 
            /* 'stretch' para que el papel del libro sea perfecto */
            object-fit: stretch; 
        }
    </style>
</head>
<body>
    <div id="flipbook"></div>

    <script>
        const totalPaginas = 44; 
        const carpeta = 'paginas/'; 

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            // Proporción A3 horizontal exacta
            width: 1414, 
            height: 1000, 
            
            size: 'stretch',
            showCover: true, 
            maxShadowOpacity: 0.4,
            mobileScrollSupport: true,
            autoSize: true,
            
            // Forzamos modo una sola página para que se vea grande y bien centrado
            usePortrait: true, 
            startPage: 0
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = '<img src="' + carpeta + nombreArchivo + '" alt="Página ' + i + '">';
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        loadImages();
    </script>
</body>
</html>
