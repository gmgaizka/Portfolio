<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; background: #111; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column; 
            font-family: 'Constantia', 'Palatino Linotype', 'Palatino', 'Georgia', serif; 
        }
        
        #viewport { 
            flex: 1; width: 100vw; height: 100vh; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            position: relative;
        }

        #canvas { 
            display: block; transition: transform 0.25s ease-out; 
            transform-origin: center center; /* Mantiene el zoom centrado */
            padding: 1000px; /* Espacio de sobra para scroll infinito */
        }

        #flipbook { width: 2828px !important; height: 1000px !important; background: transparent; }
        .page { background: white; width: 1414px !important; height: 1000px !important; }
        .page img { width: 100% !important; height: 100% !important; object-fit: fill !important; }
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; }

        /* INTERFAZ INTEGRADA (Como en la imagen) */
        .ui-wrapper {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999;
            width: 90%; max-width: 500px;
        }

        .control-bar { 
            background: rgba(25, 25, 25, 0.85); 
            padding: 12px 25px; border-radius: 50px; 
            border: 1px solid #444; 
            display: flex; align-items: center; justify-content: space-between; 
            gap: 20px; backdrop-filter: blur(15px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .label { 
            color: white; font-size: 11px; letter-spacing: 2px; 
            text-transform: uppercase; white-space: nowrap; 
        }

        .page-counter { 
            color: #aaa; font-size: 11px; letter-spacing: 1px; 
            white-space: nowrap; min-width: 70px; text-align: right;
        }

        #zoomRange { 
            flex: 1; accent-color: #fff; cursor: pointer; height: 2px; 
            outline: none; background: rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            .ui-wrapper { width: 95%; bottom: 20px; }
            .control-bar { padding: 10px 18px; gap: 12px; }
            #canvas { padding: 500px; } /* Ajuste para móvil */
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="canvas"><div id="flipbook"></div></div>
    </div>

    <div class="ui-wrapper">
        <div class="control-bar">
            <span class="label">ZOOM</span>
            <input type="range" id="zoomRange" step="0.01">
            <span class="page-counter" id="pageDisplay">PAG. 1 / 44</span>
        </div>
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';
        let initialScale = 1;

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, height: 1000, size: 'fixed', 
            showCover: true, usePortrait: false, flippingTime: 1000, startPage: 0
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        pageFlip.on('flip', (e) => {
            document.getElementById('pageDisplay').innerText = `PAG. ${e.data + 1} / ${totalPaginas}`;
        });

        function initZoom() {
            const isMobile = window.innerWidth <= 768;
            const marginFactor = isMobile ? 0.95 : 0.65;
            
            const scaleW = (window.innerWidth * marginFactor) / 1414;
            const scaleH = (window.innerHeight * marginFactor) / 1000;
            
            initialScale = Math.min(scaleW, scaleH);
            
            const zoomRange = document.getElementById('zoomRange');
            const canvas = document.getElementById('canvas');

            zoomRange.min = initialScale;
            zoomRange.max = isMobile ? 3.5 : 2.5; 
            zoomRange.value = initialScale;
            canvas.style.transform = `scale(${initialScale})`;
            
            // Centramos el scroll inicial
            const viewport = document.getElementById('viewport');
            viewport.scrollLeft = (canvas.offsetWidth - viewport.offsetWidth) / 2;
            viewport.scrollTop = (canvas.offsetHeight - viewport.offsetHeight) / 2;
        }

        loadImages();
        window.onload = initZoom;
        window.onresize = initZoom;

        document.getElementById('zoomRange').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            const canvas = document.getElementById('canvas');
            const viewport = document.getElementById('viewport');
            
            canvas.style.transform = `scale(${scale})`;
            
            // Si el zoom es mayor al inicial, permitimos scroll, si no, lo bloqueamos centrado
            if (scale > initialScale + 0.01) {
                viewport.style.overflow = 'auto';
            } else {
                viewport.style.overflow = 'hidden';
                viewport.scrollTo({
                    left: (canvas.offsetWidth - viewport.offsetWidth) / 2,
                    top: (canvas.offsetHeight - viewport.offsetHeight) / 2,
                    behavior: 'smooth'
                });
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') pageFlip.flipNext();
            if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        });
    </script>
</body>
</html>
