<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { 
            margin: 0; background: #111; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column; 
            font-family: 'Constantia', serif; 
        }
        
        /* Ventana que mira al área gigante */
        #viewport { 
            flex: 1; width: 100vw; height: 100vh; 
            overflow: auto; /* Permitimos scroll siempre */
            display: block; 
            -webkit-overflow-scrolling: touch;
        }

        /* Área gigante para que el scroll nunca se acabe */
        #scroll-area {
            width: 5000px; height: 3000px;
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        #canvas { 
            display: block; 
            transition: transform 0.2s ease-out; 
            transform-origin: center center;
            will-change: transform;
        }

        #flipbook { width: 2828px !important; height: 1000px !important; background: transparent; }
        .page { background: white; width: 1414px !important; height: 1000px !important; }
        .page img { width: 100% !important; height: 100% !important; object-fit: fill !important; }
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; }

        /* INTERFAZ CONSTANTIA */
        .ui-wrapper {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999;
            width: 90%; max-width: 500px;
        }
        .control-bar { 
            background: rgba(20, 20, 20, 0.9); 
            padding: 12px 25px; border-radius: 50px; 
            border: 1px solid #444; display: flex; align-items: center; justify-content: space-between; 
            gap: 20px; backdrop-filter: blur(15px);
        }
        .label, .page-counter { color: white; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
        .page-counter { color: #888; min-width: 80px; text-align: right; }
        #zoomRange { flex: 1; accent-color: #fff; cursor: pointer; height: 2px; }

        @media (max-width: 768px) {
            .ui-wrapper { width: 95%; bottom: 20px; }
            .control-bar { padding: 10px 18px; gap: 10px; }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="scroll-area">
            <div id="canvas">
                <div id="flipbook"></div>
            </div>
        </div>
    </div>

    <div class="ui-wrapper">
        <div class="control-bar">
            <span class="label">ZOOM</span>
            <input type="range" id="zoomRange" step="0.01">
            <span class="page-counter" id="pageDisplay">PAG. 1 / 44</span>
        </div>
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';
        let initialScale = 1;

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, height: 1000, size: 'fixed', 
            showCover: true, usePortrait: false, flippingTime: 1000, startPage: 0,
            drawShadow: false // Quitamos la raya central que pediste antes
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        pageFlip.on('flip', (e) => {
            document.getElementById('pageDisplay').innerText = `PAG. ${e.data + 1} / ${totalPaginas}`;
        });

        function initZoom() {
            const isMobile = window.innerWidth <= 768;
            const marginFactor = isMobile ? 0.95 : 0.65;
            const scaleW = (window.innerWidth * marginFactor) / 1414;
            const scaleH = (window.innerHeight * marginFactor) / 1000;
            initialScale = Math.min(scaleW, scaleH);
            
            const zoomRange = document.getElementById('zoomRange');
            zoomRange.min = initialScale;
            zoomRange.max = isMobile ? 4.0 : 2.5; 
            zoomRange.value = initialScale;
            
            document.getElementById('canvas').style.transform = `scale(${initialScale})`;
            centerView();
        }

        function centerView() {
            const vp = document.getElementById('viewport');
            // Centramos el scroll en el área gigante de 5000x3000
            vp.scrollLeft = (5000 - window.innerWidth) / 2;
            vp.scrollTop = (3000 - window.innerHeight) / 2;
        }

        loadImages();
        window.onload = () => {
            initZoom();
            setTimeout(centerView, 100); // Pequeño delay para asegurar el render
        };
        window.onresize = initZoom;

        document.getElementById('zoomRange').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            document.getElementById('canvas').style.transform = `scale(${scale})`;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') pageFlip.flipNext();
            if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        });
    </script>
</body>
</html>
