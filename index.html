<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Gaizka García</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #viewport { 
            flex: 1; width: 100vw; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }

        #canvas { 
            display: block; transition: transform 0.2s ease-out; 
            transform-origin: center center; padding: 800px; 
        }

        #flipbook { width: 2828px !important; height: 1000px !important; background: transparent; }
        .page { background: white; width: 1414px !important; height: 1000px !important; }
        .page img { width: 100% !important; height: 100% !important; object-fit: fill !important; }
        canvas, .st-page-shadow { display: none !important; opacity: 0 !important; }

        /* CONTROLES COMBINADOS */
        .controls-wrapper {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999;
            display: flex; flex-direction: column; gap: 10px; align-items: center;
        }

        .control-panel { 
            background: rgba(25,25,25,0.9); padding: 10px 25px; border-radius: 50px; 
            border: 1px solid #333; display: flex; align-items: center; gap: 15px; 
            backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input[type="range"] { width: 180px; accent-color: #fff; cursor: pointer; opacity: 0.8; transition: opacity 0.3s; }
        input[type="range"]:hover { opacity: 1; }
        
        .label { color: white; font-family: sans-serif; font-size: 9px; font-weight: bold; letter-spacing: 2px; min-width: 50px; }
        .page-num { color: #888; font-family: monospace; font-size: 11px; min-width: 40px; text-align: right; }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="canvas"><div id="flipbook"></div></div>
    </div>

    <div class="controls-wrapper">
        <div class="control-panel">
            <span class="label">PÁGINA</span>
            <input type="range" id="pageRange" min="0" max="43" value="0">
            <span class="page-num" id="pageDisplay">1 / 44</span>
        </div>

        <div class="control-panel">
            <span class="label">ZOOM</span>
            <input type="range" id="zoomRange" step="0.01">
        </div>
    </div>

    <script>
        const totalPaginas = 44;
        const carpeta = 'paginas/';
        let initialScale = 1;

        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 1414, height: 1000, size: 'fixed', 
            showCover: true, usePortrait: false, flippingTime: 1000, startPage: 0
        });

        function loadImages() {
            const pages = [];
            for (let i = 1; i <= totalPaginas; i++) {
                const div = document.createElement('div');
                div.className = 'page';
                let nombreArchivo = (i === 1) ? 'Portfolio.jpg' : 'Portfolio' + i + '.jpg';
                div.innerHTML = `<img src="${carpeta}${nombreArchivo}" alt="Pág ${i}">`;
                pages.push(div);
            }
            pageFlip.loadFromHTML(pages);
        }

        // LÓGICA DE NAVEGACIÓN
        const pageRange = document.getElementById('pageRange');
        const pageDisplay = document.getElementById('pageDisplay');

        pageRange.addEventListener('input', (e) => {
            const pageIdx = parseInt(e.target.value);
            pageFlip.turnToPage(pageIdx);
        });

        // Actualizar la barra cuando el usuario pase páginas a mano
        pageFlip.on('flip', (e) => {
            const currentPage = e.data + 1;
            pageRange.value = e.data;
            pageDisplay.innerText = `${currentPage} / ${totalPaginas}`;
        });

        // LÓGICA DE ZOOM (La que ya teníamos perfecta)
        function initZoom() {
            const scaleW = (window.innerWidth * 0.7) / 1414;
            const scaleH = (window.innerHeight * 0.7) / 1000;
            initialScale = Math.min(scaleW, scaleH);
            
            const zoomRange = document.getElementById('zoomRange');
            const canvas = document.getElementById('canvas');
            zoomRange.min = initialScale;
            zoomRange.max = 2.0; 
            zoomRange.value = initialScale;
            canvas.style.transform = `scale(${initialScale})`;
        }

        loadImages();
        window.onload = initZoom;
        window.onresize = initZoom;

        document.getElementById('zoomRange').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            const canvas = document.getElementById('canvas');
            const viewport = document.getElementById('viewport');
            canvas.style.transform = `scale(${scale})`;
            
            if (scale > initialScale + 0.05) {
                viewport.style.overflow = 'auto';
                viewport.style.alignItems = 'flex-start';
                viewport.style.justifyContent = 'flex-start';
            } else {
                viewport.style.overflow = 'hidden';
                viewport.style.alignItems = 'center';
                viewport.style.justifyContent = 'center';
                viewport.scrollTo(0,0);
            }
        });
    </script>
</body>
</html>
